<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Order TV Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0a0a0c',
                            800: '#121216',
                            700: '#1a1a24',
                            600: '#262636',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- SETUP VIEW -->
    <div id="setup-view" class="flex-1 flex flex-col items-center justify-center p-6 max-w-4xl mx-auto w-full">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/10 text-indigo-400 mb-4 border border-indigo-500/20 shadow-lg shadow-indigo-500/5">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">TV Running Order Display</h1>
            <p class="mt-2 text-slate-400 text-lg">Upload your Excel file with times and segments to launch the live TV dashboard.</p>
        </div>

        <div class="w-full bg-dark-800 border border-dark-600 rounded-2xl p-8 shadow-2xl relative overflow-hidden backdrop-blur-xl">
            <div class="absolute -right-20 -top-20 w-64 h-64 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="grid md:grid-cols-2 gap-8 items-center">
                <!-- Drop Zone -->
                <div>
                    <label for="excel-file" id="drop-zone" class="flex flex-col items-center justify-center border-2 border-dashed border-dark-600 hover:border-indigo-500/50 bg-dark-900/50 hover:bg-dark-900 rounded-xl p-8 cursor-pointer transition-all duration-300 group text-center">
                        <svg class="w-12 h-12 text-slate-500 group-hover:text-indigo-400 transition-colors mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">Drop your Excel file here, or <span class="text-indigo-400 underline underline-offset-4">browse</span></span>
                        <span class="text-xs text-slate-500 mt-1">Supports .xlsx, .xls, .csv</span>
                        <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" class="hidden">
                    </label>
                </div>

                <!-- Instructions / Template info -->
                <div class="flex flex-col justify-center space-y-4">
                    <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Excel Format Requirements</h3>
                    <ul class="space-y-3 text-sm text-slate-400">
                        <li class="flex items-start">
                            <svg class="w-5 h-5 text-indigo-400 mr-2 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span><strong>Column 1:</strong> Time (e.g., <code>09:00</code> or <code>09:00:00</code>)</span>
                        </li>
                        <li class="flex items-start">
                            <svg class="w-5 h-5 text-indigo-400 mr-2 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span><strong>Column 2:</strong> Segment or Item description</span>
                        </li>
                        <li class="flex items-start">
                            <svg class="w-5 h-5 text-indigo-400 mr-2 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span>Auto-detects columns even if headers differ.</span>
                        </li>
                    </ul>
                    <div class="pt-2 flex gap-3">
                        <button id="load-sample-btn" class="px-4 py-2 bg-dark-700 hover:bg-dark-600 text-slate-200 text-sm font-medium rounded-lg border border-dark-600 transition-colors flex items-center gap-2">
                            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                            Load Sample Running Order
                        </button>
                    </div>
                </div>
            </div>

            <div id="file-loaded-alert" class="hidden mt-6 p-4 bg-emerald-500/10 border border-emerald-500/20 rounded-xl flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
                    <span id="file-name-display" class="text-sm font-medium text-emerald-300"></span>
                </div>
                <button id="launch-btn" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg shadow-lg shadow-emerald-600/20 transition-all transform hover:scale-[1.02] flex items-center gap-2">
                    Launch TV Display
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- TV DISPLAY VIEW -->
    <div id="display-view" class="hidden flex-1 flex flex-col h-screen overflow-hidden bg-dark-900">
        <!-- Top Status Bar -->
        <header class="bg-dark-800 border-b border-dark-600 px-8 py-4 flex items-center justify-between shrink-0">
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2 bg-dark-700 px-3 py-1.5 rounded-lg border border-dark-600">
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></div>
                    <span id="event-title" class="text-xs font-semibold uppercase tracking-wider text-slate-300">LIVE RUNNING ORDER</span>
                </div>
                <span id="loaded-filename-tag" class="text-xs text-slate-400 font-mono hidden sm:inline-block"></span>
            </div>
            
            <div class="flex items-center space-x-6">
                <!-- Clock -->
                <div class="text-2xl font-mono font-bold tracking-wider text-white" id="live-clock">00:00:00</div>
                
                <!-- Controls -->
                <div class="flex items-center space-x-2 border-l border-dark-600 pl-6">
                    <button id="fullscreen-btn" title="Toggle Fullscreen" class="p-2 text-slate-400 hover:text-white bg-dark-700 hover:bg-dark-600 rounded-lg transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5V4m0 0h-4m4 4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    </button>
                    <button id="exit-display-btn" title="Back to Setup" class="p-2 text-slate-400 hover:text-red-400 bg-dark-700 hover:bg-dark-600 rounded-lg transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main TV Content Grid -->
        <main
