<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Running Order Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap');
        html, body {
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #d7172f;
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="text-white flex flex-col selection:bg-white selection:text-[#d7172f]">

    <!-- SETUP VIEW -->
    <div id="setup-view" class="flex-1 flex flex-col items-center justify-center p-8 max-w-4xl mx-auto w-full h-full">
        <div class="text-center mb-8">
            <h1 class="text-5xl font-black tracking-tight text-white uppercase">TV Running Order</h1>
            <p class="mt-3 text-white/90 text-2xl font-semibold">Paste your Excel/Google Sheets columns below:</p>
        </div>

        <div class="w-full bg-black/30 border-2 border-white/30 rounded-3xl p-8 shadow-2xl backdrop-blur-xl flex flex-col gap-6">
            <textarea id="paste-input" rows="8" placeholder="Paste your running order here... (Time and Action columns)" class="w-full bg-black/40 border-2 border-white/30 rounded-2xl p-6 text-white font-mono text-lg placeholder-white/40 focus:outline-none focus:border-white transition-colors resize-none shadow-inner"></textarea>

            <div class="flex items-center justify-between">
                <span id="paste-status" class="text-lg text-white font-mono font-bold">0 valid items detected</span>
                <button id="launch-btn" class="px-12 py-5 bg-white hover:bg-slate-100 text-[#d7172f] font-black text-xl rounded-2xl shadow-xl transition-all transform hover:scale-105 cursor-pointer uppercase tracking-wide">
                    Launch TV Display
                </button>
            </div>
        </div>
    </div>

    <!-- TV DISPLAY VIEW -->
    <div id="display-view" class="hidden flex-1 flex flex-col h-screen w-screen overflow-hidden" style="background-color: #d7172f;">
        <!-- Top Status Bar -->
        <header class="bg-black/40 border-b-2 border-white/30 px-8 py-4 flex items-center justify-between shrink-0 shadow-lg h-[9vh]">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-3 bg-black/40 px-5 py-2 rounded-2xl border-2 border-white/40 shadow-md">
                    <div class="w-4 h-4 rounded-full bg-white animate-ping"></div>
                    <span class="text-base font-black uppercase tracking-widest text-white">LIVE RUNNING ORDER</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-8">
                <!-- Clock -->
                <div class="text-4xl font-mono font-black tracking-wider text-white flex items-center gap-4">
                    <span id="live-clock">00:00:00</span>
                    <span id="time-source-badge" class="text-xs font-sans px-3 py-1 rounded-xl bg-black/60 text-white border-2 border-white/40 uppercase tracking-widest font-bold">Sync</span>
                </div>
                
                <!-- Controls -->
                <div class="flex items-center space-x-4 border-l-2 border-white/30 pl-8">
                    <button id="fullscreen-btn" title="Toggle Fullscreen" class="p-3 text-white hover:text-white bg-black/40 hover:bg-black/60 rounded-2xl transition-colors cursor-pointer border-2 border-white/30 shadow-md">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-5V4m0 0h-4m4 4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    </button>
                    <button id="exit-display-btn" title="Back to Setup" class="p-3 text-white hover:text-white bg-black/40 hover:bg-black/60 rounded-2xl transition-colors cursor-pointer border-2 border-white/30 shadow-md">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main TV Content Grid (Chrome Fixed Heights) -->
        <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 h-[91vh] overflow-hidden">
            <!-- Left Side: Now, Next, After That (7 Cols) -->
            <div class="lg:col-span-7 p-6 flex flex-col gap-4 overflow-hidden border-r-2 border-white/30 bg-gradient-to-br from-[#d7172f] to-[#bd1328] h-full">
                
                <!-- 1. NOW ON STAGE / SCREEN -->
                <div class="flex flex-col flex-[1.6] justify-between">
                    <div class="flex items-center justify-between shrink-0">
                        <span class="inline-flex items-center px-5 py-1.5 rounded-2xl text-base font-black uppercase tracking-widest bg-white text-[#d7172f] shadow-xl animate-pulse-subtle border-2 border-white">
                            <span class="w-3.5 h-3.5 rounded-full bg-[#d7172f] mr-2.5"></span> NOW ON STAGE / SCREEN
                        </span>
                        <span id="current-time-badge" class="font-mono text-2xl font-black text-white bg-black/50 px-5 py-1.5 rounded-2xl border-2 border-white/40 shadow-inner">--:--:--</span>
                    </div>

                    <div id="current-segment-card" class="w-full h-[62%] bg-black/40 border-4 border-white rounded-3xl p-6 shadow-2xl relative overflow-hidden flex flex-col justify-center">
                        <h2 id="current-segment-title" class="text-3xl sm:text-4xl lg:text-5xl font-black text-white tracking-tight leading-tight">Waiting for start...</h2>
                    </div>
                </div>

                <!-- 2. UP NEXT -->
                <div class="flex flex-col flex-1 justify-between">
                    <div class="flex items-center justify-between shrink-0">
                        <span class="inline-flex items-center px-4 py-1 rounded-xl text-sm font-black uppercase tracking-widest bg-black/40 text-white border-2 border-white/30 shadow-md">
                            UP NEXT
                        </span>
                        <span id="next-time-badge" class="font-mono text-xl font-black text-white bg-black/50 px-4 py-1 rounded-xl border-2 border-white/30">--:--:--</span>
                    </div>

                    <div id="next-segment-card" class="w-full h-[62%] bg-black/30 border-2 border-white/40 rounded-2xl px-6 py-4 shadow-xl flex flex-col justify-center">
                        <h3 id="next-segment-title" class="text-2xl sm:text-3xl font-black text-white tracking-tight">--</h3>
                    </div>
                </div>

                <!-- 3. AFTER THAT -->
                <div class="flex flex-col flex-[0.7] justify-between">
                    <div class="flex items-center justify-between shrink-0">
                        <span class="inline-flex items-center px-3.5 py-0.5 rounded-lg text-xs font-black uppercase tracking-widest bg-black/30 text-white/90 border border-white/25">
                            AFTER THAT
                        </span>
                        <span id="after-next-time-badge" class="font-mono text-lg font-bold text-white bg-black/40 px-3.5 py-0.5 rounded-xl border border-white/25">--:--:--</span>
                    </div>

                    <div id="after-next-segment-card" class="w-full h-[55%] bg-black/20 border-2 border-white/25 rounded-2xl px-6 py-3 shadow-md flex flex-col justify-center">
                        <h4 id="after-next-segment-title" class="text-xl font-bold text-white tracking-tight">--</h4>
                    </div>
                </div>

            </div>

            <!-- Right Side: Full Running Order Queue (5 Cols) -->
            <div class="lg:col-span-5 flex flex-col h-full bg-[#bd1328] overflow-hidden shadow-2xl">
                <div class="px-8 py-5 bg-black/40 border-b-2 border-white/30 flex items-center justify-between shrink-0">
                    <h3 class="text-lg font-black uppercase tracking-widest text-white">Full Schedule Queue</h3>
                    <span id="queue-count" class="text-base text-white font-mono font-bold">0 items</span>
                </div>
                
                <div id="running-order-list" class="flex-1 overflow-y-auto p-5 space-y-4">
                    <!-- Dynamic Items Injected Here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Application Script -->
    <script>
        let runningOrderData = [];
        let globalTimeOffset = 0;

        const setupView = document.getElementById('setup-view');
        const displayView = document.getElementById('display-view');
        const pasteInput = document.getElementById('paste-input');
        const pasteStatus = document.getElementById('paste-status');
        const launchBtn = document.getElementById('launch-btn');
        const exitDisplayBtn = document.getElementById('exit-display-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const liveClock = document.getElementById('live-clock');
        const timeSourceBadge = document.getElementById('time-source-badge');
        const runningOrderList = document.getElementById('running-order-list');

        const currentTimeBadge = document.getElementById('current-time-badge');
        const currentSegmentTitle = document.getElementById('current-segment-title');
        
        const nextTimeBadge = document.getElementById('next-time-badge');
        const nextSegmentTitle = document.getElementById('next-segment-title');
        const nextSegmentCard = document.getElementById('next-segment-card');

        const afterNextTimeBadge = document.getElementById('after-next-time-badge');
        const afterNextSegmentTitle = document.getElementById('after-next-segment-title');
        const afterNextSegmentCard = document.getElementById('after-next-segment-card');

        const queueCount = document.getElementById('queue-count');

        async function syncGlobalTime() {
            try {
                const response = await fetch('https://worldtimeapi.org/api/ip', { cache: 'no-store' });
                if (response.ok) {
                    const data = await response.json();
                    const globalDate = new Date(data.datetime);
                    globalTimeOffset = globalDate.getTime() - Date.now();
                    timeSourceBadge.textContent = "Synced";
                }
            } catch (err) {
                timeSourceBadge.textContent = "Local";
            }
        }

        function getGlobalNow() {
            return new Date(Date.now() + globalTimeOffset);
        }

        function parseTimeStr(str) {
            if (!str) return null;
            const match = str.toString().trim().match(/(\d{1,2})[:\.]([0-5]\d)(?:[:\.]([0-5]\d))?/);
            if (match) {
                let h = parseInt(match[1], 10);
                let m = parseInt(match[2], 10);
                let s = match[3] ? parseInt(match[3], 10) : 0;
                let totalSeconds = h * 3600 + m * 60 + s;
                let formatted = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                return { totalSeconds, formatted };
            }
            return null;
        }

        function parsePastedData(text) {
            let parsed = [];
            const lines = text.split('\n');

            for (let line of lines) {
                if (!line.trim()) continue;
                let cols = line.split('\t');
                if (cols.length < 2) {
                    cols = line.split(/\s{2,}/);
                }

                let timeObj = null;
                let actionText = "";

                for (let col of cols) {
                    let cleanCol = col.trim();
                    if (!timeObj) {
                        let t = parseTimeStr(cleanCol);
                        if (t) {
                            timeObj = t;
                            continue;
                        }
                    }
                    if (!actionText && cleanCol.length > 1) {
                        let lower = cleanCol.toLowerCase();
                        if (!['time', 'action', 'responsible', 'notes', 'pre-match', 'half time'].includes(lower) && !cleanCol.startsWith('Stoke City')) {
                            actionText = cleanCol;
                        }
                    }
                }

                if (timeObj && actionText) {
                    parsed.push({
                        time: timeObj.formatted,
                        rawSeconds: timeObj.totalSeconds,
                        title: actionText
                    });
                }
            }

            parsed.sort((a, b) => a.rawSeconds - b.rawSeconds);

            let uniqueParsed = [];
            let seen = new Set();
            for (let item of parsed) {
                let key = item.rawSeconds + '-' + item.title;
                if (!seen.has(key)) {
                    seen.add(key);
                    uniqueParsed.push(item);
                }
            }
            return uniqueParsed;
        }

        pasteInput.addEventListener('input', () => {
            const parsed = parsePastedData(pasteInput.value);
            pasteStatus.textContent = `${parsed.length} valid items detected`;
        });

        launchBtn.addEventListener('click', () => {
            const parsed = parsePastedData(pasteInput.value);

            if (parsed.length === 0) {
                alert("Could not detect valid running order items. Please ensure you copied rows that contain timestamps.");
                return;
            }

            runningOrderData = parsed;
            setupView.classList.add('hidden');
            displayView.classList.remove('hidden');
            queueCount.textContent = `${runningOrderData.length} items`;
            syncGlobalTime();
            updateClockAndState();
        });

        exitDisplayBtn.addEventListener('click', () => {
            displayView.classList.add('hidden');
            setupView.classList.remove('hidden');
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        function updateClockAndState() {
            const now = getGlobalNow();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            liveClock.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (displayView.classList.contains('hidden') || runningOrderData.length === 0) return;

            const currentTotalSeconds = hours * 3600 + minutes * 60 + seconds;

            let currentIndex = -1;
            for (let i = 0; i < runningOrderData.length; i++) {
                if (currentTotalSeconds >= runningOrderData[i].rawSeconds) {
                    currentIndex = i;
                } else {
                    break;
                }
            }

            if (currentIndex === -1 && runningOrderData.length > 0) currentIndex = 0; 

            const currentSegment = runningOrderData[currentIndex] || runningOrderData[0];
            const nextSegment = runningOrderData[currentIndex + 1] || null;
            const afterNextSegment = runningOrderData[currentIndex + 2] || null;

            currentTimeBadge.textContent = currentSegment.time;
            currentSegmentTitle.textContent = currentSegment.title;

            if (nextSegment) {
                nextTimeBadge.textContent = nextSegment.time;
                nextSegmentTitle.textContent = nextSegment.title;
                nextSegmentCard.classList.remove('opacity-40');
            } else {
                nextTimeBadge.textContent = "FINAL";
                nextSegmentTitle.textContent = "End of Running Order";
                nextSegmentCard.classList.add('opacity-40');
            }

            if (afterNextSegment) {
                afterNextTimeBadge.textContent = afterNextSegment.time;
                afterNextSegmentTitle.textContent = afterNextSegment.title;
                afterNextSegmentCard.classList.remove('opacity-40');
            } else {
                afterNextTimeBadge.textContent = "--:--:--";
                afterNextSegmentTitle.textContent = "No further items";
                afterNextSegmentCard.classList.add('opacity-40');
            }

            renderQueueList(currentIndex);
        }

        function renderQueueList(activeIndex) {
            let html = '';
            runningOrderData.forEach((item, idx) => {
                const isActive = idx === activeIndex;
                const isPast = idx < activeIndex;

                let badgeClass = "bg-black/40 text-white border-white/30";
                let itemBg = "bg-black/20 border-white/15";
                let textStyle = "text-white/90 font-bold text-lg";

                if (isActive) {
                    badgeClass = "bg-white text-[#d7172f] font-black border-white shadow-lg";
                    itemBg = "bg-white/30 border-white shadow-2xl";
                    textStyle = "text-white font-black text-2xl";
                } else if (isPast) {
                    itemBg = "bg-black/30 border-transparent opacity-40";
                    textStyle = "text-white/40 line-through font-semibold text-base";
                }

                html += `
                    <div ${isActive ? 'id="active-queue-item"' : ''} class="p-5 rounded-2xl border-2 ${itemBg} transition-all flex items-center justify-between gap-4">
                        <div class="flex items-center space-x-4 min-w-0">
                            <span class="font-mono text-base px-4 py-1.5 rounded-xl border-2 ${badgeClass} shrink-0">${item.time}</span>
                            <span class="truncate ${textStyle}">${item.title}</span>
                        </div>
                        ${isActive ? '<span class="flex h-4 w-4 relative shrink-0"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span><span class="relative inline-flex rounded-full h-4 w-4 bg-white"></span></span>' : ''}
                    </div>
                `;
            });
            runningOrderList.innerHTML = html;

            const activeEl = document.getElementById('active-queue-item');
            if (activeEl) {
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        setInterval(syncGlobalTime, 300000);
        setInterval(updateClockAndState, 1000);
    </script>
</body>
</html>
